<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Student JSON Data</title>
    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            align-items: center
        }

        .main-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px
        }

        table {
            border-radius: 10px;
            overflow: hidden
        }

        thead th {
            background: #212529 !important;
            color: white
        }

        button {
            border-radius: 8px;
            font-weight: 500
        }

        h1 {
            font-weight: 600
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-md-11 col-sm-12">
                <div class="main-card">
                    <h1 class="text-center mb-4">"student.json" File Data</h1>
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover text-center align-middle">
                            <thead>
                                <tr>
                                    <th class="text-white">Id</th>
                                    <th class="text-white">Name</th>
                                    <th class="text-white">Semester</th>
                                    <th class="text-white">Subjects</th>
                                    <th class="text-white">Contact No</th>
                                    <th class="text-white">Email</th>
                                </tr>
                            </thead>
                            <tbody id="StudentData"></tbody>
                        </table>
                    </div>
                    <div class="text-center mt-4">
                        <button onclick="loadStudent()" class="btn btn-dark btn-lg px-4">Load Students Data</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadStudent() {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "student.json", true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    const students = JSON.parse(xhr.responseText);
                    let output = "";
                    students.forEach(student => {
                        output += `<tr>
                                        <td>${student.id}</td>
                                        <td>${student.name}</td>
                                        <td>${student.semester}</td>
                                        <td>${student.subjects}</td>
                                        <td>${student.contactno}</td>
                                        <td>${student.email}</td>
                                    </tr>`
                    });
                    document.getElementById("StudentData").innerHTML = output;
                }
            }
            xhr.send();
        }
    </script>
</body>

</html>
