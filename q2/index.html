<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Catalogs & Students Data</title>
    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh
        }

        .main-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.2);
            padding: 25px;
            margin-bottom: 40px
        }

        h1 {
            font-weight: 600;
            font-size: 28px
        }

        thead th {
            background: #212529 !important;
            color: white
        }

        .table {
            border-radius: 10px;
            overflow: hidden
        }

        button {
            border-radius: 8px;
            font-weight: 500
        }
    </style>
</head>

<body>
    <div class="container py-5">

        <div class="main-card">
            <h1 class="text-center mb-4">"catalog.xml" File Data</h1>
            <hr>
            <div class="table-responsive">
                <table class="table table-bordered table-hover text-center align-middle">
                    <thead>
                        <tr>
                            <th class="text-white">Id</th>
                            <th class="text-white">Name</th>
                            <th class="text-white">Brand</th>
                            <th class="text-white">Category</th>
                            <th class="text-white">Price</th>
                            <th class="text-white">Description</th>
                        </tr>
                    </thead>
                    <tbody id="CatalogData"></tbody>
                </table>
            </div>
            <div class="text-center mt-4">
                <button onclick="loadCatalogData()" class="btn btn-dark btn-lg px-4">Load Catalogs Data</button>
            </div>
        </div>

        <div class="main-card">
            <h1 class="text-center mb-4">"student.json" File Data</h1>
            <hr>
            <div class="table-responsive">
                <table class="table table-bordered table-hover text-center align-middle">
                    <thead>
                        <tr>
                            <th class="text-white">Id</th>
                            <th class="text-white">Name</th>
                            <th class="text-white">Roll NO.</th>
                            <th class="text-white">Course</th>
                            <th class="text-white">Semester</th>
                        </tr>
                    </thead>
                    <tbody id="StudentData"></tbody>
                </table>
            </div>
            <div class="text-center mt-4">
                <button onclick="loadStudent()" class="btn btn-dark btn-lg px-4">Load Students Data</button>
            </div>
        </div>

    </div>

    <script>
        function loadCatalogData() {
            const xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var xmlDoc = this.responseXML;
                    var products = xmlDoc.getElementsByTagName("product");
                    var data = "";
                    for (const product of products) {
                        let id = product.getElementsByTagName("id")[0].textContent;
                        let name = product.getElementsByTagName("name")[0].textContent;
                        let brand = product.getElementsByTagName("brand")[0].textContent;
                        let category = product.getElementsByTagName("category")[0].textContent;
                        let price = product.getElementsByTagName("price")[0].textContent;
                        let description = product.getElementsByTagName("description")[0].textContent;
                        data += `<tr>
                                    <td>${id}</td>
                                    <td>${name}</td>
                                    <td>${brand}</td>
                                    <td>${category}</td>
                                    <td>${price}</td>
                                    <td>${description}</td>
                                </tr>`;
                    }
                    document.getElementById("CatalogData").innerHTML = data;
                }
            };
            xhr.open("GET", "catalog.xml", true);
            xhr.send();
        }

        function loadStudent() {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "student.json", true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    const students = JSON.parse(xhr.responseText);
                    let output = "";
                    students.forEach(student => {
                        output += `<tr>
                                    <td>${student.id}</td>
                                    <td>${student.name}</td>
                                    <td>${student.rollNo}</td>
                                    <td>${student.course}</td>
                                    <td>${student.semester}</td>
                                </tr>`
                    });
                    document.getElementById("StudentData").innerHTML = output;
                }
            }
            xhr.send();
        }
    </script>
</body>

</html>
