<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Information Form</title>
    <style>
        body {
            background: #f5f5f5;
        }

        .form-box {
            border: 1px solid #ddd;
            border-radius: 10px;
            max-width: 500px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.15);
        }

        label {
            font-weight: 500;
        }

        #addBox input {
            width: 70%;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="form-box bg-white p-4 w-100">
            <form onsubmit="showMsg()" id="form">
                <h4 class="text-center mb-3">Information Form</h4>

                <div class="mb-2">
                    <label for="fname">Full Name</label>
                    <input type="text" id="fname" class="form-control" required>
                </div>

                <div class="mb-2">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="mb-2">
                    <label for="contact">Contact</label>
                    <input type="number" id="contact" class="form-control" required>
                </div>

                <div class="mb-2">
                    <label for="gender">Gender</label><br>
                    <input type="radio" name="gender" id="male"> <label for="male">Male</label>
                    <input type="radio" name="gender" id="female"> <label for="female">Female</label>
                    <input type="radio" name="gender" id="other"> <label for="other">Other</label>
                </div>

                <div class="mb-2">
                    <label for="address">Address</label>
                    <textarea class="form-control" id="address" rows="2"></textarea>
                </div>

                <div class="mb-3">
                    <label for="language">Language</label>
                    <select id="language" class="form-control">
                        <option>Java</option>
                        <option>Python</option>
                        <option>JavaScript</option>
                        <option>C++</option>
                    </select>
                    <a href="#" id="addLang">Add Language</a>

                    <div id="addBox" class="mt-2" style="display:none;">
                        <input type="text" id="newLang" class="form-control d-inline" placeholder="Enter language">
                        <button type="button" class="btn btn-primary btn-sm mt-2" id="addBtn">Add</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100">Submit</button>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#addLang").click(function (e) {
                e.preventDefault();
                $("#addBox").show();
            });
            $("#addBtn").click(function () {
                let lang = $("#newLang").val();
                if (lang != "") {
                    $("#language").append("<option>" + lang + "</option>");
                    $("#newLang").val("");
                    $("#addBox").hide();
                }
            });
        });

        function showMsg() {
            alert("Thank you for your response.");
            document.getElementById("form").reset();
        }
    </script>
</body>

</html>
