<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets - Movie Booking</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 p-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">MovieTickets</a>
            <div class="ms-auto d-flex align-items-center text-white">
                <span id="userNameDisplay" class="me-3 fw-medium"></span>
                <button id="logoutBtn" class="btn btn-sm btn-outline-light">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="text-center mb-5">
            <h2 class="display-6 fw-bold">Now Showing</h2>
            <p class="text-muted">Select a movie and book your tickets instantly.</p>
        </div>

        <!-- Movies List Container (Populated by AJAX) -->
        <div class="row" id="movieList">
            <!-- Loading indicator -->
            <div class="col-12 text-center py-5" id="loadingMovies">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 text-muted">Loading movies...</p>
            </div>
        </div>
    </div>

    <!-- Booking Modal (Bootstrap 5) -->
    <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="bookingModalLabel">Book Tickets</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <h4 id="modalMovieTitle" class="mb-3 text-primary fw-bold"></h4>
                    <div class="d-flex justify-content-between text-muted mb-3 border-bottom pb-2">
                        <span><strong>Time:</strong> <span id="modalShowTime"></span></span>
                        <span><strong>Price/Ticket:</strong> ₹<span id="modalPrice"></span></span>
                    </div>

                    <div class="mb-4">
                        <label for="ticketCount" class="form-label fw-bold">Number of Tickets</label>
                        <input type="number" class="form-control form-control-lg text-center" id="ticketCount" min="1"
                            max="10" value="1">
                    </div>

                    <div class="alert alert-info py-2 mb-0 d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Total Amount:</span>
                        <span class="h4 mb-0 text-success fw-bold">₹<span id="modalTotalAmount"></span></span>
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary px-4" id="confirmBookingBtn">Confirm Booking</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery & Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
