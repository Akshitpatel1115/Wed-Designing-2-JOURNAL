<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            background: #EEF2F7;
            font-family: 'Segoe UI', sans-serif;
            color: #1F2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        .header-title {
            font-size: 26px;
            font-weight: 700;
        }

        .form-control {
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-primary {
            background: #2F6FED;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #2558C7;
        }

        .error {
            font-size: 12px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">GroceryStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="items.html">Items</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary text-white px-3 ms-2"
                            href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container main-section">
        <div class="col-lg-4 col-md-6">
            <div class="card p-4">

                <div class="text-center mb-4">
                    <h3 class="header-title">Customer Login</h3>
                    <p class="text-muted">Login to continue shopping</p>
                </div>

                <form action="index.html" id="loginForm">

                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-control">
                        <span class="error text-danger" id="email-error"></span>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="pass">Password</label>
                        <input type="password" id="pass" class="form-control">
                        <span class="error text-danger" id="pass-error"></span>
                    </div>

                    <div class="d-flex justify-content-between mb-3">
                        <a href="#" class="small text-decoration-none">Forgot Password?</a>
                        <a href="register.html" class="small text-decoration-none">Create Account</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#loginForm").submit(function (e) {
                let valid = true;
                $(".error").text("");

                let email = $("#email").val();
                let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

                if (email == "") {
                    $("#email-error").text("Email is required");
                    valid = false;
                }
                else if (!emailPattern.test(email)) {
                    $("#email-error").text("Enter valid email");
                    valid = false;
                }

                let pass = $("#pass").val();

                if (pass == "") {
                    $("#pass-error").text("Password is required");
                    valid = false;
                }
                else if (pass.length < 6) {
                    $("#pass-error").text("Password must be at least 6 characters");
                    valid = false;
                }

                if (!valid) {
                    e.preventDefault();
                }

                if (valid) {
                    alert("Login successful. Welcome!");
                }
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
