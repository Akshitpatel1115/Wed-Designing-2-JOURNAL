<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Items</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background: #EEF2F7;
            font-family: 'Segoe UI', sans-serif;
            color: #1F2937;
        }

        .section-title {
            font-size: 28px;
            font-weight: 700;
        }

        .product-card {
            border: none;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
            transition: .2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .product-img {
            height: 150px;
            width: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        .price {
            font-weight: 600;
            color: #2F6FED;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">GroceryStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="items.html">Items</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link btn btn-primary text-white px-3 ms-2" href="register.html">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">

        <div class="text-center mb-5">
            <h2 class="section-title">Fresh Grocery Items</h2>
            <p class="text-muted">Browse our wide range of fresh and quality groceries</p>
        </div>

        <div class="row mb-4 justify-content-center">

            <div class="col-md-4">
                <input type="text" id="searchItem" class="form-control" placeholder="Search grocery items...">
            </div>

            <div class="col-md-3">
                <select id="categoryFilter" class="form-control">
                    <option value="all">All Categories</option>
                    <option value="fruit">Fruits</option>
                    <option value="vegetable">Vegetables</option>
                    <option value="dairy">Dairy</option>
                    <option value="grain">Grains</option>
                </select>
            </div>

        </div>

        <div class="row g-4">

            <div class="col-md-3 item" data-category="fruit">
                <div class="card product-card p-3 text-center">
                    <img src="image/apple.jpg" alt="Fresh Apples" class="product-img">
                    <h6 class="mt-3">Fresh Apples</h6>
                    <p class="price">₹120 / kg</p>
                    <button class="btn btn-primary w-100 add-cart" data-name="Apple">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-3 item" data-category="fruit">
                <div class="card product-card p-3 text-center">
                    <img src="image/banana.jpg" alt="Bananas" class="product-img">
                    <h6 class="mt-3">Bananas</h6>
                    <p class="price">₹60 / dozen</p>
                    <button class="btn btn-primary w-100 add-cart" data-name="Banana">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-3 item" data-category="vegetable">
                <div class="card product-card p-3 text-center">
                    <img src="image/tomato.jpg" alt="Fresh Tomatoes" class="product-img">
                    <h6 class="mt-3">Fresh Tomatoes</h6>
                    <p class="price">₹40 / kg</p>
                    <button class="btn btn-primary w-100 add-cart" data-name="Tomato">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-3 item" data-category="vegetable">
                <div class="card product-card p-3 text-center">
                    <img src="image/potato.jpg" alt="Potatoes" class="product-img">
                    <h6 class="mt-3">Potatoes</h6>
                    <p class="price">₹35 / kg</p>
                    <button class="btn btn-primary w-100 add-cart" data-name="Potato">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-3 item" data-category="dairy">
                <div class="card product-card p-3 text-center">
                    <img src="image/milk.jpg" alt="Milk" class="product-img">
                    <h6 class="mt-3">Milk</h6>
                    <p class="price">₹55 / litre</p>
                    <button class="btn btn-primary w-100 add-cart" data-name="Milk">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-3 item" data-category="grain">
                <div class="card product-card p-3 text-center">
                    <img src="image/bread.jpg" alt="Bread" class="product-img">
                    <h6 class="mt-3">Bread</h6>
                    <p class="price">₹35 / pack</p>
                    <button class="btn btn-primary w-100 add-cart" data-name="Bread">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-3 item" data-category="dairy">
                <div class="card product-card p-3 text-center">
                    <img src="image/egg.jpg" alt="Eggs" class="product-img">
                    <h6 class="mt-3">Eggs</h6>
                    <p class="price">₹75 / tray</p>
                    <button class="btn btn-primary w-100 add-cart" data-name="Eggs">Add to Cart</button>
                </div>
            </div>

            <div class="col-md-3 item" data-category="grain">
                <div class="card product-card p-3 text-center">
                    <img src="image/rice.jpg" alt="Rice" class="product-img">
                    <h6 class="mt-3">Rice</h6>
                    <p class="price">₹80 / kg</p>
                    <button class="btn btn-primary w-100 add-cart" data-name="Rice">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {

            $("#searchItem").on("keyup", function () {
                let value = $(this).val().toLowerCase();

                $(".item").filter(function () {
                    $(this).toggle($(this).text().toLowerCase().includes(value))
                })
            })

            $("#categoryFilter").change(function () {
                let category = $(this).val();
                if (category == "all") { $(".item").show(); }
                else { $(".item").hide(); $('[data-category="' + category + '"]').show(); }
            })

        })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
