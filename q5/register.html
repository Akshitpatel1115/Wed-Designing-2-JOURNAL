<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            background: #EEF2F7;
            font-family: 'Segoe UI', sans-serif;
            color: #1F2937;
        }

        .card {
            border: none;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: .3px;
            color: #1F2937;
        }

        .text-muted {
            color: #6B7280 !important;
            font-size: 14px;
        }

        .section-title {
            font-weight: 600;
            font-size: 16px;
            color: #374151;
            border-bottom: 1px solid #E5E7EB;
            padding-bottom: 6px;
            margin-bottom: 18px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }

        .form-control {
            border-radius: 6px;
            border: 1px solid #D1D5DB;
            font-size: 14px;
            padding: 8px 10px;
        }

        .form-control:focus {
            border-color: #2F6FED;
            box-shadow: 0 0 0 .15rem rgba(47, 111, 237, .15);
        }

        .btn-primary {
            background: #2F6FED;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            padding: 9px;
            font-size: 15px;
        }

        .btn-primary:hover {
            background: #2558C7;
        }

        .error {
            font-size: 12px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">GroceryStore</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="items.html">Items</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary text-white px-3 ms-2"
                            href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <div class="card p-4">

                    <div class="text-center mb-4">
                        <h3 class="header-title">Customer Account Registration</h3>
                        <p class="text-muted mb-0">Create your account to continue</p>
                    </div>

                    <form action="login.html" id="registerForm">

                        <div class="row">

                            <div class="col-md-6">

                                <div class="mb-3">
                                    <label class="form-label" for="fname">Full Name</label>
                                    <input type="text" id="fname" class="form-control">
                                    <span class="error text-danger" id="fname-error"></span>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="email">Email</label>
                                    <input type="email" id="email" class="form-control">
                                    <span class="error text-danger" id="email-error"></span>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="mobile">Mobile No.</label>
                                    <input type="number" id="mobile" class="form-control">
                                    <span class="error text-danger" id="mobile-error"></span>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="pass">Password</label>
                                    <input type="password" id="pass" class="form-control">
                                    <span class="error text-danger" id="pass-error"></span>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="conPass">Confirm Password</label>
                                    <input type="password" id="conPass" class="form-control">
                                    <span class="error text-danger" id="conPass-error"></span>
                                </div>

                            </div>

                            <div class="col-md-6">

                                <p class="section-title">Address Information</p>

                                <div class="mb-3">
                                    <label for="address" class="form-label">Address / Street</label>
                                    <input type="text" id="address" class="form-control">
                                    <span class="error text-danger" id="address-error"></span>
                                </div>

                                <div class="mb-3">
                                    <label for="city" class="form-label">City</label>
                                    <input type="text" id="city" class="form-control">
                                    <span class="error text-danger" id="city-error"></span>
                                </div>

                                <div class="mb-3">
                                    <label for="state" class="form-label">State</label>
                                    <input type="text" id="state" class="form-control">
                                    <span class="error text-danger" id="state-error"></span>
                                </div>

                                <div class="mb-3">
                                    <label for="pincode" class="form-label">Pincode</label>
                                    <input type="number" id="pincode" class="form-control">
                                    <span class="error text-danger" id="pincode-error"></span>
                                </div>

                                <div class="mt-3">
                                    <button type="submit" class="btn btn-primary w-100">Create Account</button>
                                </div>

                            </div>

                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#registerForm").submit(function (e) {
                let valid = true;
                $(".error").text("");

                let fname = $("#fname").val().trim();
                if (fname == "") { $("#fname-error").text("Full name is required"); valid = false; }

                let email = $("#email").val();
                let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
                if (email == "") { $("#email-error").text("Email is required"); valid = false; }
                else if (!emailPattern.test(email)) { $("#email-error").text("Enter valid email"); valid = false; }

                let mobile = $("#mobile").val().trim();
                if (mobile == "") { $("#mobile-error").text("Mobile number is required"); valid = false; }
                else if (mobile.length != 10) { $("#mobile-error").text("Mobile number must be contain 10 digits"); valid = false; }

                let pass = $("#pass").val();
                if (pass == "") { $("#pass-error").text("Password is required"); valid = false; }
                else if (pass.length < 6) { $("#pass-error").text("Password must be at least 6 characters"); valid = false; }

                let conPass = $("#conPass").val();
                if (conPass == "") { $("#conPass-error").text("Confirm password is required"); valid = false; }
                else if (conPass != pass) { $("#conPass-error").text("Password does not match"); valid = false; }

                let address = $("#address").val().trim();
                if (address == "") { $("#address-error").text("Address is required"); valid = false; }

                let city = $("#city").val().trim();
                if (city == "") { $("#city-error").text("City is required"); valid = false; }

                let state = $("#state").val().trim();
                if (state == "") { $("#state-error").text("State is required"); valid = false; }

                let pincode = $("#pincode").val();
                if (pincode == "") { $("#pincode-error").text("Pincode is required"); valid = false; }

                if (!valid) { e.preventDefault(); }

                if (valid) { alert("Your account has been successfully created. Welcome!"); }

            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
