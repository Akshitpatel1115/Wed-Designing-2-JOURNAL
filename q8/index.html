<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee XML Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh
        }

        .main-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
            padding: 30px
        }

        thead {
            background: #212529
        }

        thead th {
            color: #fff
        }

        h1 {
            font-weight: 600
        }

        button {
            border-radius: 8px
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="main-card">
            <h1 class="text-center mb-4">"employee.xml" File Data</h1>
            <hr>
            <div class="table-responsive">
                <table class="table table-bordered table-hover text-center align-middle">
                    <thead>
                        <tr>
                            <th class="bg-dark text-white">Id</th>
                            <th class="bg-dark text-white">First Name</th>
                            <th class="bg-dark text-white">Last Name</th>
                            <th class="bg-dark text-white">Title</th>
                            <th class="bg-dark text-white">Department</th>
                            <th class="bg-dark text-white">Contact No.</th>
                            <th class="bg-dark text-white">Email</th>
                        </tr>
                    </thead>
                    <tbody id="empData"></tbody>
                </table>
            </div>
            <div class="text-center mt-4">
                <button onclick="loadEmpData()" class="btn btn-dark btn-lg px-4">Load Employees Data</button>
            </div>
        </div>
    </div>
    <script>
        function loadEmpData() {
            const xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var xmlDoc = this.responseXML;
                    var employees = xmlDoc.getElementsByTagName("employee");
                    var data = "";

                    for (const emp of employees) {
                        let id = $(emp).find("id").text();
                        let firstname = $(emp).find("firstname").text();
                        let lastname = $(emp).find("lastname").text();
                        let title = $(emp).find("title").text();
                        let department = $(emp).find("department").text();
                        let contactno = $(emp).find("contactno").text();
                        let email = $(emp).find("email").text();

                        data += `<tr>
                                    <td>${id}</td>
                                    <td>${firstname}</td>
                                    <td>${lastname}</td>
                                    <td>${title}</td>
                                    <td>${department}</td>
                                    <td>${contactno}</td>
                                    <td>${email}</td>
                                </tr>`;
                    }

                    $("#empData").html(data);
                };
            }
            xhr.open("GET", "employee.xml", true);
            xhr.send();
        }
    </script>
</body>

</html>
