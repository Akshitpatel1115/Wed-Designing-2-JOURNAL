<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .card {
            border-radius: 15px;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.2);
        }

        .error {
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container h-100">
        <div class="row h-100 justify-content-center align-items-center">
            <div class="col-lg-4 col-md-6 col-sm-10">

                <div class="card p-4">
                    <h3 class="text-center mb-4">Student Register</h3>

                    <form id="registerForm">

                        <div class="mb-3">
                            <label class="form-label" for="fname">First Name</label>
                            <input type="text" id="fname" class="form-control">
                            <span class="error text-danger" id="fname-error"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="lname">Last Name</label>
                            <input type="text" id="lname" class="form-control">
                            <span class="error text-danger" id="lname-error"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="age">Age</label>
                            <input type="number" id="age" class="form-control">
                            <span class="error text-danger" id="age-error"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" class="form-control">
                            <span class="error text-danger" id="email-error"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="stream">Stream</label>
                            <select id="stream" class="form-select">
                                <option>Select Stream</option>
                                <option>BCA</option>
                                <option>BBA</option>
                                <option>BCom</option>
                                <option>BSC-IT</option>
                            </select>
                            <span class="error text-danger" id="stream-error"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="pass">Password</label>
                            <input type="password" id="pass" class="form-control">
                            <span class="error text-danger" id="pass-error"></span>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Register</button>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {

            $("#registerForm").submit(function (e) {

                let valid = true;
                $(".error").text("");

                // First Name
                let fname = $("#fname").val().trim();
                if (fname == "") {
                    $("#fname-error").text("First name is required");
                    valid = false;
                }

                // Last Name
                let lname = $("#lname").val().trim();
                if (lname == "") {
                    $("#lname-error").text("Last name is required");
                    valid = false;
                }

                // Age
                let age = $("#age").val();
                if (age == "") {
                    $("#age-error").text("Age is required");
                    valid = false;
                } else if (age < 17 || age > 30) {
                    $("#age-error").text("Age must be between 17 and 30");
                    valid = false;
                }

                // Email
                let email = $("#email").val();
                let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

                if (email == "") {
                    $("#email-error").text("Email is required");
                    valid = false;
                } else if (!emailPattern.test(email)) {
                    $("#email-error").text("Enter valid email");
                    valid = false;
                }

                // Stream
                let stream = $("#stream").val();
                if (stream == "Select Stream") {
                    $("#stream-error").text("Please select stream");
                    valid = false;
                }

                // Password
                let pass = $("#pass").val();
                if (pass == "") {
                    $("#pass-error").text("Password is required");
                    valid = false;
                } else if (pass.length < 6) {
                    $("#pass-error").text("Password must be at least 6 characters");
                    valid = false;
                }

                if (!valid) {
                    e.preventDefault();
                }

                if(valid){
                    alert("Student registered successfully!");
                }

            });

        });
    </script>

</body>

</html>
