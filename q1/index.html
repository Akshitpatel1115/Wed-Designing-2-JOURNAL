<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title> Event Registration Form </title>
    <style>
        * {
            background-color: Beige;
            font-family: 'Poppins', sans-serif;
        }

        .regForm {
            border: 1px solid black;
            border-radius: 10px;
            max-width: 500px;
            box-shadow: 0px 5px 50px rgba(0, 0, 0, 0.15);
        }

        option {
            background-color: mintcream;
            color: darkslategray;
        }
    </style>
</head>

<body>
    <div class="container-fluide d-flex justify-content-center align-items-center min-vh-100 py-3">
        <div class="regForm p-4 p-md-5 bg-white w-100">
            <form action="#" onsubmit="showMessage()" id="Form" class="bg-white">
                <h2 style="color: Teal;" class="heading bg-white text-center text-md-start">Event Registration Form</h2>
                <hr>

                <div class="my-3 bg-white">
                    <label for="name" class="bg-white"> Person Name : </label>
                    <input type="text" id="name" class="form-control" required>
                </div>

                <div class="my-3 bg-white">
                    <label for="age" class="bg-white"> Person Age : </label>
                    <input type="number" id="age" class="form-control" required>
                </div>

                <div class="my-3 bg-white">
                    <label for="email" class="bg-white"> Email Id : </label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="my-3 bg-white">
                    <label for="contact" class="bg-white"> Contact No. : </label>
                    <input type="number" id="contact" class="form-control" required>
                </div>

                <div class="my-3 bg-white">
                    <label for="event" class="bg-white"> Event : </label>
                    <select id="event" class="form-control" required>
                        <option value="">Select Event</option>
                        <option value="Farewell Ceremony">Farewell Ceremony</option>
                        <option value="Freshers Party">Freshers Party</option>
                        <option value="Sports Day">Sports Day</option>
                        <option value="Pet Show">Pet Show</option>
                        <option value="Science Exhibition">Science Exhibition</option>
                        <option value="Workshop">Workshop</option>
                    </select>
                </div>

                <div class="my-3 bg-white">
                    <label for="time" class="bg-white">Time</label>
                    <input type="time" id="time" class="form-control" required>
                </div>

                <input type="checkbox" id="checkbox"> <label for="checkbox" class="bg-white">Agree to the <a href="t&c.html"
                        class="bg-white">Terms &
                        Conditions.</a></label> <br>

                <button style="background-color: Teal;" class=" btn btn-lg text-white w-100" type="submit" disabled>
                    Submit </button>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#checkbox").click(function () {
                if ($(this).prop("checked")) {
                    $("button").removeAttr("disabled");
                } else {
                    $("button").attr("disabled", "disabled");
                }
            });

            setInterval(function () {
                $(".heading").fadeToggle()
            }, 90);

            $(".form-control").focus(function () {
                $(this).css({ "background-color": "mintcream", "color": "darkslategray" });
            });

            $(".form-control").blur(function () {
                $(this).css({ "background-color": "white", "color": "black" });
            });
        })

        function showMessage() {
            alert("Your registration has been completed successfully!");
            document.getElementById("Form").reset();
        }
    </script>
</body>

</html>
